name: Deploy to Modal

# Every push to main re-runs the science checks and, if they pass, deploys the gateway to the
# nova-frontier-model Modal app. Needs the repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET
# (an API token of the Modal workspace).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deployments share the job-state Dict, so they queue instead of overlapping or being cancelled.
concurrency:
  group: modal-deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/science-tests.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      MODAL_ENVIRONMENT: main
      NISAR_APP_NAME: nova-frontier-model
      NISAR_VOLUME: nova-frontier-chip-cache
      NISAR_EVENT_RELEASE: "1"
      NISAR_EARTHDATA_SECRET: nova-frontier-earthdata
      NISAR_CASES_PATH: cases
      NISAR_GATEWAY_AUTH_SECRET_NAME: ${{ vars.NISAR_GATEWAY_AUTH_SECRET_NAME }}
      # Keep gateway admission aligned with the worker pool. The backend's own MAX_ACTIVE_EXPLORATIONS
      # (Railway) is independent and must not exceed NISAR_MAX_ACTIVE_JOBS. The Starter plan caps a
      # workspace at 100 concurrent containers, shared with the preview apps.
      NISAR_MAX_ACTIVE_JOBS: "32"
      NISAR_WORKER_CONTAINERS: "32"
      NISAR_WORKER_CPU: "2"
      NISAR_WORKER_CPU_LIMIT: "4"
      NISAR_WORKER_MEMORY_MB: "4096"
      NISAR_WORKER_BUFFER_CONTAINERS: "4"
      NISAR_WORKER_SCALEDOWN_SECONDS: "120"
      NISAR_JOBS_PER_DAY: "5000"
      NISAR_JOBS_PER_IP_DAY: "5000"
      NISAR_REQUESTS_PER_MINUTE: "3000"
      NISAR_GATEWAY_CONCURRENCY: "64"
      NISAR_GATEWAY_CPU: "0.5"
      NISAR_GATEWAY_CPU_LIMIT: "1"
      NISAR_GATEWAY_MEMORY_LIMIT_MB: "1024"
      NISAR_GATEWAY_TIMEOUT_SECONDS: "60"
      NISAR_GATEWAY_SCALEDOWN_SECONDS: "120"
      # 20 GiB a day is about 600 GiB a month, inside the 1 TiB of egress the Starter plan includes.
      NISAR_DAILY_DELIVERY_BYTES: "21474836480"
      # Measured 2026-11-13: fresh areas took 3.5 to 4 minutes with three jobs at once and the
      # default 240 s limit killed the busier ones, leaving their slots taken until the lease ended.
      NISAR_WORKER_TIMEOUT_SECONDS: "420"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check the Modal credentials
        shell: bash
        run: |
          if [ -z "$MODAL_TOKEN_ID" ] || [ -z "$MODAL_TOKEN_SECRET" ]; then
            echo "::error title=Modal credentials missing::Add the repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET (an API token of the Modal workspace)."
            exit 1
          fi
      - name: Install the Modal client
        run: python -m pip install modal==1.6.4
      - name: Install measured event release
        run: python -m modal run --env main scripts/install_event_release.py
      - name: Build and deploy
        run: python -m modal deploy --env main modal_app.py
      - name: Verify the deployment
        shell: bash
        run: |
          url=$(python -c 'import os, modal; print(modal.Function.from_name(os.environ["NISAR_APP_NAME"], "api", environment_name="main").get_web_url())')
          echo "Gateway: $url"
          PYTHONPATH=scripts python - "$url" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          from modal_preview_smoke import wait_for_health

          print(json.dumps(wait_for_health(sys.argv[1], sys.argv[2])))
          PY
          if [ -n "$NISAR_GATEWAY_AUTH_SECRET_NAME" ]; then
            python scripts/modal_preview_event_smoke.py "$url" --public-reads-only
          else
            python scripts/modal_preview_event_smoke.py "$url"
          fi
          {
            echo "### Deployed to Modal"
            echo "- App \`$NISAR_APP_NAME\`: $url"
            echo "- Commit \`$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"
